# Task 1 CNN — AgriVision Assignment 5
# All hyperparameters and random seeds recorded here for reproducibility.

random_seed: 42

paths:
  # Resolved at runtime by data.py — do not hardcode absolute paths here.
  # Local:  ../assignment2_outputs/...
  # Kaggle: /kaggle/input/datasets/muhammadhaaris27083/assignment1-outputs/assignment1_outputs/...
  assignment2_local: "../assignment2_outputs"
  assignment2_kaggle: "/kaggle/input/datasets/muhammadhaaris27083/assignment1-outputs/assignment1_outputs"
  outputs: "cnn_outputs"

data:
  image_size: 128
  val_split: 0.10          # reduced from 0.15 → more training data
  test_split: 0.10         # reduced from 0.15 → ~113 train, 14 val, 14 test

augmentation:
  rotation_degrees: 45     # increased from 30
  horizontal_flip: true
  vertical_flip: true
  brightness_factor: 0.3   # increased from 0.2
  zoom_factor: 0.15        # increased from 0.10

model_a:
  name: "BaselineCNN"
  conv_blocks: 3
  filters: [32, 64, 128]
  use_batch_norm: true
  activation: "relu"
  pooling: "max"
  global_avg_pool: true
  dropout: 0.0
  l2_weight_decay: 0.0
  max_params: 1_500_000

model_b:
  name: "DeeperCNN"
  conv_blocks: 4
  filters: [32, 64, 128, 256]
  use_batch_norm: true
  activation: "relu"
  pooling: "max"
  global_avg_pool: true
  dropout: 0.3
  l2_weight_decay: 1.0e-4
  residual_connection: true

training:
  epochs: 100              # increased from 50
  early_stopping_patience: 15   # increased from 7
  batch_size: 4            # reduced from 8 — more gradient updates per epoch
  loss: "mse"

optimizer_comparison:
  adam:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 0.0
  sgd:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    nesterov: true

model_b_optimizer: "adam"

lr_scheduler:
  type: "CosineAnnealingLR"   # changed from ReduceLROnPlateau — smoother for small datasets
  T_max: 100                  # matches epochs
  eta_min: 1.0e-6
